# This repository ships workflows and actions, not a package, so it has no
# manifest to take a version from. The README's release badge stands in, the
# way qcs-infrastructure versions its own.
#
# An empty `versioned_files` would leave the Git tags as the only source of
# truth, and knope decides which tags count by which branch contains them: on a
# pull request, where the checkout is a merge ref, it found none and read the
# version as 0.0.0. A file in the tree is unambiguous wherever it is checked
# out, and this one shows the current version to anyone reading the repository.
[package]
versioned_files = [
    { path = "README.md", regex = 'releases/tag/v(?<version>\d+\.\d+\.\d+.*)\)' },

    # The reusable workflows reference this repository's own actions by tag, and
    # those references must name the version being released, in the commit the
    # tag will point at — otherwise a caller pinning a workflow at v1.2.3 gets
    # the previous version's action underneath it, silently. Declaring them here
    # means knope rewrites them, and refuses to release if any disagrees.
    # One regex updates every occurrence in a file.
    { path = ".github/workflows/prepare-prerelease.yml", regex = 'qcs-gha-infrastructure/[^@]+@v(?<version>\d+\.\d+\.\d+.*)' },
    { path = ".github/workflows/prepare-release.yml", regex = 'qcs-gha-infrastructure/[^@]+@v(?<version>\d+\.\d+\.\d+.*)' },
    { path = ".github/workflows/rust-ci.yml", regex = 'qcs-gha-infrastructure/[^@]+@v(?<version>\d+\.\d+\.\d+.*)' },
    { path = ".github/workflows/rust-cli-build.yml", regex = 'qcs-gha-infrastructure/[^@]+@v(?<version>\d+\.\d+\.\d+.*)' },
    { path = ".github/workflows/rust-cli-prerelease.yml", regex = 'qcs-gha-infrastructure/[^@]+@v(?<version>\d+\.\d+\.\d+.*)' },
    { path = ".github/workflows/rust-cli-release.yml", regex = 'qcs-gha-infrastructure/[^@]+@v(?<version>\d+\.\d+\.\d+.*)' },
    { path = ".github/workflows/rust-integration-tests.yml", regex = 'qcs-gha-infrastructure/[^@]+@v(?<version>\d+\.\d+\.\d+.*)' },
]
changelog = "CHANGELOG.md"

[github]
owner = "rigetti"
repo = "qcs-gha-infrastructure"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = 'git commit -m "chore: prepare release $version"'

# Push before Release: with a forge configured, Release publishes through the
# API, and GitHub rejects a release whose target commit it has never seen.
[[workflows.steps]]
type = "Command"
command = "git push"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "get-version"
help_text = "Get the current version of this repository"

[[workflows.steps]]
type = "Command"
command = 'echo "$version"'
