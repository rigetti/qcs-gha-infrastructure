# This repository ships workflows and actions, not a package, so it has no
# manifest to take a version from. A bare VERSION file stands in.
#
# An empty `versioned_files` would leave the Git tags as the only source of
# truth, and knope decides which tags count by which branch contains them: on a
# pull request, where the checkout is a merge ref, it found none and read the
# version as 0.0.0. A file in the tree is unambiguous wherever it is checked
# out, and shows the current version to anyone reading the repository.
[package]
versioned_files = [{ path = "VERSION", regex = '(?<version>\d+\.\d+\.\d+)' }]
changelog = "CHANGELOG.md"

[github]
owner = "rigetti"
repo = "qcs-gha-infrastructure"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

# The reusable workflows here reference this repository's own actions by tag.
# Those references have to name the version being released, in the very commit
# the tag will point at: a caller pinning the workflow at v1.2.3 would
# otherwise get the previous version's action underneath it, silently.
[[workflows.steps]]
type = "Command"
command = "scripts/internal-pins set $version"

[[workflows.steps]]
type = "Command"
# -a because the pin rewrite above is unstaged; PrepareRelease staged only the
# changelog.
command = 'git commit -am "chore: prepare release $version"'

# Push before Release: with a forge configured, Release publishes through the
# API, and GitHub rejects a release whose target commit it has never seen.
[[workflows.steps]]
type = "Command"
command = "git push"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "get-version"
help_text = "Get the current version of this repository"

[[workflows.steps]]
type = "Command"
command = 'echo "$version"'
