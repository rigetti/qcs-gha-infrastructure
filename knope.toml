# This repository ships reusable workflows, not a package, so it has no
# manifest to take a version from. The README's release badge stands in.
[package]
versioned_files = [
    { path = "README.md", regex = 'releases/tag/v(?<version>\d+\.\d+\.\d+.*)\)' },
]
changelog = "CHANGELOG.md"

[github]
owner = "rigetti"
repo = "qcs-gha-infrastructure"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = 'git commit -m "chore: prepare release $version"'

# Push before Release: with a forge configured, Release publishes through the
# API, and GitHub rejects a release whose target commit it has never seen.
[[workflows.steps]]
type = "Command"
command = "git push"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "get-version"
help_text = "Get the current version of this repository"

[[workflows.steps]]
type = "Command"
command = 'echo "$version"'
