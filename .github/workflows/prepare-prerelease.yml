name: Prepare prerelease

# Reusable workflow: cut a release candidate from the branch it is dispatched
# on, so it can be tested before merging. Callers wire this to
# workflow_dispatch only; the automatic dry-run-and-release half lives in
# prepare-release.yml.
on:
  workflow_call:
    inputs:
      prerelease-label:
        description: >-
          Label for the prerelease, e.g. `beta` produces 1.2.3-beta.0. Defaults
          to `rc`.
        type: string
        required: false
        default: ""
      knope-version:
        type: string
        required: false
        default: "0.23.0"
      knope-workflow:
        description: >-
          Name of the knope workflow to run. Override this when the release is
          split across workflows — a `draft-release` that prepares and pushes,
          and a `publish-release` run later, once the artifacts to attach exist.
        type: string
        required: false
        default: release
      default-branch:
        description: >-
          Branch that releases automatically, and which therefore cannot be
          prereleased by hand.
        type: string
        required: false
        default: main
    secrets:
      token:
        description: >-
          Token used to push the prerelease commit and tag and to publish the
          prerelease. Must be a PAT or app token if the push needs to trigger
          further workflows, such as a binary build: pushes made with
          GITHUB_TOKEN do not start new runs.
        required: true

permissions:
  contents: read

jobs:
  prepare-prerelease:
    runs-on: ubuntu-latest
    steps:
      # GitHub offers every branch in the Run workflow dropdown and gives no way
      # to restrict the list, so the default branch is refused here: pushing to
      # it already releases, and a prerelease of it would duplicate or race that.
      # This runs before checkout, so no token is used on the way to failing.
      - name: Refuse the default branch
        if: github.ref == format('refs/heads/{0}', inputs.default-branch)
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
        run: |
          echo "::error::${DEFAULT_BRANCH} releases automatically when merged to; there is nothing to prerelease. Dispatch this from the branch you want a release candidate for."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Prerelease the dispatched branch, so its tag lands on that branch.
          ref: ${{ github.ref }}
          token: ${{ secrets.token }}

      - name: Install knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          # Test before updating, breaking changes likely:
          # https://github.com/knope-dev/action#install-latest-version
          version: ${{ inputs.knope-version }}

      # Repeated prereleases from one branch would otherwise accumulate
      # changelog entries: each PrepareRelease writes the pending changes on
      # top of what the previous one already wrote. Cut three release
      # candidates from a branch and the third changelog entry contains the
      # first two as well, which then lands on the default branch when the
      # branch merges.
      #
      # So restore each changelog named in knope.toml to its state on the
      # default branch first. A changelog that does not exist there is deleted
      # rather than restored: it is new in this branch, so its correct prior
      # state is "absent".
      #
      # Formerly the `actions/reset-changelogs` composite action. Keep this
      # step identical in prepare-release.yml and prepare-prerelease.yml;
      # ci.yml checks that, and tests prepare-release.yml's copy.
      - name: Reset changelogs
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          KNOPE_CONFIG: knope.toml
        run: |
          set -euo pipefail

          if [[ ! -f "${KNOPE_CONFIG}" ]]; then
            echo "No ${KNOPE_CONFIG}; nothing to reset."
            exit 0
          fi

          # knope.toml declares either one [package] or a [packages] table, each
          # optionally naming a changelog. tomllib ships with the runner's
          # Python, so this needs nothing installed.
          # A while-read loop rather than mapfile, which is bash 4 and so absent
          # from the bash macOS ships; this should run the same locally.
          changelogs=()
          while IFS= read -r line; do
            changelogs+=("${line}")
          done < <(python3 - "${KNOPE_CONFIG}" <<'PY'
          import sys, tomllib

          with open(sys.argv[1], "rb") as f:
              config = tomllib.load(f)

          packages = config.get("packages")
          if packages:
              entries = packages.values()
          else:
              entries = [config.get("package", {})]

          for entry in entries:
              changelog = entry.get("changelog")
              if changelog:
                  print(changelog)
          PY
          )

          if [[ ${#changelogs[@]} -eq 0 ]]; then
            echo "No changelog declared in ${KNOPE_CONFIG}; nothing to reset."
            exit 0
          fi

          # The default branch is not necessarily checked out, and a shallow
          # clone may not have it at all.
          git fetch --no-tags --depth=1 origin "${DEFAULT_BRANCH}"

          for changelog in "${changelogs[@]}"; do
            if git cat-file -e "FETCH_HEAD:${changelog}" 2>/dev/null; then
              echo "Restoring ${changelog} from origin/${DEFAULT_BRANCH}"
              git restore --source=FETCH_HEAD -- "${changelog}"
            elif [[ -e "${changelog}" ]]; then
              echo "${changelog} does not exist on ${DEFAULT_BRANCH}; removing it"
              rm -f "${changelog}"
            else
              echo "${changelog} exists on neither side; nothing to do"
            fi
          done

          git status --short

      # Through env, not interpolation: a shell script is not the place to
      # expand a value from the event payload.
      - name: Configure git identity
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          git config --global user.name "${ACTOR}"
          git config --global user.email "${ACTOR}@users.noreply.github.com"

      - name: Prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
          PRERELEASE_LABEL: ${{ inputs.prerelease-label }}
          KNOPE_WORKFLOW: ${{ inputs.knope-workflow }}
        run: |
          set -euo pipefail
          label="${PRERELEASE_LABEL:-rc}"
          echo "Running prerelease with label '${label}' on ${GITHUB_REF}"
          knope "${KNOPE_WORKFLOW}" --verbose "--prerelease-label=${label}"
