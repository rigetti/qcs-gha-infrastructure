name: Rust integration tests

# Reusable workflow: run a test command that needs credentials.
#
# Callers are expected to invoke this twice — once for trusted code (no
# environment, so no approval prompt) and once for pull requests from forks,
# passing an `environment` whose protection rules require a maintainer's
# approval. Secrets are never available to `pull_request` runs from forks, so
# the fork-facing caller must be triggered by `pull_request_target` and pass
# the pull request's head SHA as `ref`.
#
# SECURITY: when `ref` points at untrusted code, the approving reviewer is the
# only thing standing between a fork's contents and these secrets. Read the
# diff — including build scripts, macros, and test fixtures — before approving.
on:
  workflow_call:
    inputs:
      test-command:
        description: Command that runs the credentialed tests.
        type: string
        required: true
      ref:
        description: >-
          Git ref or SHA to check out. Defaults to the ref the workflow was
          triggered on.
        type: string
        required: false
        default: ""
      environment:
        description: >-
          Name of the GitHub environment to run under. Leave empty to run
          without one. Set this to an environment with required reviewers to
          gate untrusted code behind manual approval.
        type: string
        required: false
        default: ""
      toolchain:
        type: string
        required: false
        default: stable
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
      cache-key:
        type: string
        required: false
        default: integration
      cache:
        description: >-
          Whether to restore and save the cargo/target cache. Set this to false
          when `ref` is untrusted code: a cache written by a fork's build is
          visible to later runs on the base branch.
        type: boolean
        required: false
        default: true
    secrets:
      github-api-token:
        description: >-
          Token exposed to the test command as both GH_TOKEN and GITHUB_TOKEN,
          since crates and CLIs disagree about which name to read.
        required: false
      gitlab-api-token:
        description: Token exposed to the test command as GITLAB_TOKEN.
        required: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    # Inputs of the inlined setup-rust steps; see scripts/check-inlined-steps.
    env:
      SETUP_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
      SETUP_RUST_COMPONENTS: ""
      SETUP_RUST_TARGETS: ""
      SETUP_RUST_CACHE: ${{ inputs.cache }}
      SETUP_RUST_CACHE_KEY: ${{ inputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # setup-rust, inlined: keep every copy identical (scripts/check-inlined-steps).
      - name: Install Rust toolchain (setup-rust)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.cargo/bin:${PATH}"
          fi
          rustup toolchain install "${SETUP_RUST_TOOLCHAIN}" --profile minimal --no-self-update
          rustup default "${SETUP_RUST_TOOLCHAIN}"
          # Both lists are space-separated, so word splitting is intended.
          # shellcheck disable=SC2086
          for component in ${SETUP_RUST_COMPONENTS}; do
            rustup component add --toolchain "${SETUP_RUST_TOOLCHAIN}" "${component}"
          done
          # shellcheck disable=SC2086
          for target in ${SETUP_RUST_TARGETS}; do
            rustup target add --toolchain "${SETUP_RUST_TOOLCHAIN}" "${target}"
          done
          rustc --version
          cargo --version
      - name: Configure cargo for CI (setup-rust)
        shell: bash
        run: |
          {
            echo "CARGO_TERM_COLOR=always"
            echo "CARGO_INCREMENTAL=0"
            echo "RUSTUP_TOOLCHAIN=${SETUP_RUST_TOOLCHAIN}"
          } >> "${GITHUB_ENV}"
      - name: Cache cargo registry (setup-rust)
        if: env.SETUP_RUST_CACHE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.SETUP_RUST_TOOLCHAIN }}-${{ env.SETUP_RUST_CACHE_KEY }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.SETUP_RUST_TOOLCHAIN }}-${{ env.SETUP_RUST_CACHE_KEY }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.SETUP_RUST_TOOLCHAIN }}-
      - name: Run integration tests
        env:
          GH_TOKEN: ${{ secrets.github-api-token }}
          GITHUB_TOKEN: ${{ secrets.github-api-token }}
          GITLAB_TOKEN: ${{ secrets.gitlab-api-token }}
        run: ${{ inputs.test-command }}
