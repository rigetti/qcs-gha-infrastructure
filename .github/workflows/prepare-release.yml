name: Prepare release

# Reusable workflow: the automatic half of a knope-driven release.
#
#   pull_request   dry run, so a PR shows what it would release
#   push           full release: version bump, changelog, commit, tag, push
#
# There is deliberately nothing to configure and no way to trigger this by
# hand. For a release candidate cut from a branch, see prepare-prerelease.yml.
on:
  workflow_call:
    inputs:
      knope-version:
        type: string
        required: false
        default: "0.23.0"
      release-commit-prefix:
        description: >-
          Commit-message prefix that marks knope's own release commit. A push of
          such a commit is skipped: it is the output of a release, not a change
          to release, and releasing it again would fail with nothing to do. Must
          match the message in knope.toml's commit step.
        type: string
        required: false
        default: "chore: prepare release"
    secrets:
      token:
        description: >-
          Token used to push the release commit and tag and to publish the
          release. Must be a PAT or app token if the push needs to trigger
          further workflows, such as a binary build: pushes made with
          GITHUB_TOKEN do not start new runs.
        required: true

permissions:
  contents: read

jobs:
  prepare-release:
    # Skip knope's own release commit. The token that pushes it is a PAT, which
    # does start new workflow runs, so without this the release re-enters this
    # workflow and fails on the second pass. Skipped rather than failed: it is
    # the expected shape of a successful release, not a problem to report.
    if: >-
      !(github.event_name == 'push'
        && startsWith(github.event.head_commit.message, inputs.release-commit-prefix))
    runs-on: ubuntu-latest
    steps:
      # A caller wires up pull_request and push only. Refuse anything else
      # rather than releasing from an unexpected ref.
      - name: Refuse events this workflow does not handle
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: |
          echo "::error::prepare-release.yml handles pull_request and push only; got ${{ github.event_name }}. Use prepare-prerelease.yml for a manual release candidate."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.token }}

      - name: Install knope
        uses: knope-dev/action@v2.1.2
        with:
          # Test before updating, breaking changes likely:
          # https://github.com/knope-dev/action#install-latest-version
          version: ${{ inputs.knope-version }}

      - name: Dry-run release
        if: github.event_name == 'pull_request'
        run: knope release --verbose --dry-run

      - name: Configure git identity
        if: github.event_name == 'push'
        run: |
          git config --global user.name '${{ github.triggering_actor }}'
          git config --global user.email '${{ github.triggering_actor }}@users.noreply.github.com'

      - name: Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
        run: knope release --verbose
