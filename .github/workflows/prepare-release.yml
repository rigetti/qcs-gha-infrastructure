name: Prepare release

# Reusable workflow: the automatic half of a knope-driven release.
#
#   pull_request   dry run, so a PR shows what it would release
#   push           full release: version bump, changelog, commit, tag, push
#
# There is deliberately nothing to configure and no way to trigger this by
# hand. For a release candidate cut from a branch, see prepare-prerelease.yml.
on:
  workflow_call:
    inputs:
      knope-version:
        type: string
        required: false
        default: "0.23.0"
      knope-workflow:
        description: >-
          Name of the knope workflow to run. Override this when the release is
          split across workflows — a `draft-release` that prepares and pushes,
          and a `publish-release` run later, once the artifacts to attach exist.
        type: string
        required: false
        default: release
      default-branch:
        description: >-
          Branch whose changelogs are restored before knope runs, so a branch
          cutting repeated prereleases does not accumulate entries.
        type: string
        required: false
        default: main
      release-commit-prefix:
        description: >-
          Commit-message prefix that marks knope's own release commit. A push of
          such a commit is skipped: it is the output of a release, not a change
          to release, and releasing it again would fail with nothing to do. Must
          match the message in knope.toml's commit step.
        type: string
        required: false
        default: "chore: prepare release"
    secrets:
      token:
        description: >-
          Token used to push the release commit and tag and to publish the
          release. Must be a PAT or app token if the push needs to trigger
          further workflows, such as a binary build: pushes made with
          GITHUB_TOKEN do not start new runs.

          Required for the release path. Pull-request dry runs fall back to the
          job's own token, so a Dependabot pull request — which is given no
          Actions secrets — still gets its dry run.
        required: false

permissions:
  contents: read

jobs:
  prepare-release:
    # Skip knope's own release commit. The token that pushes it is a PAT, which
    # does start new workflow runs, so without this the release re-enters this
    # workflow and fails on the second pass. Skipped rather than failed: it is
    # the expected shape of a successful release, not a problem to report.
    if: >-
      !(github.event_name == 'push'
        && startsWith(github.event.head_commit.message, inputs.release-commit-prefix))
    runs-on: ubuntu-latest
    steps:
      # A caller wires up pull_request and push only. Refuse anything else
      # rather than releasing from an unexpected ref.
      - name: Refuse events this workflow does not handle
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::prepare-release.yml handles pull_request and push only; got ${EVENT}. Use prepare-prerelease.yml for a manual release candidate."
          exit 1

      # A dry run needs no privileged token, and Dependabot pull requests are
      # given no Actions secrets at all, so `token` arrives empty there and
      # actions/checkout rejects it outright. Fall back to the job's own token.
      # The release path cannot accept that fallback, hence the check below.
      # The secrets context is not available to an `if`, so the test is here.
      - name: Require a real token for an actual release
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.token }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "::error::A release needs the 'token' secret: a PAT or app token, so the release push triggers downstream workflows."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}

      - name: Install knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          # Test before updating, breaking changes likely:
          # https://github.com/knope-dev/action#install-latest-version
          version: ${{ inputs.knope-version }}

      # Knope needs a branch to operate.
      - name: Name the checkout after the pull request's branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git checkout -B "${HEAD_REF}"

      # Repeated prereleases from one branch would otherwise accumulate
      # changelog entries: each PrepareRelease writes the pending changes on
      # top of what the previous one already wrote. Cut three release
      # candidates from a branch and the third changelog entry contains the
      # first two as well, which then lands on the default branch when the
      # branch merges.
      #
      # So restore each changelog named in knope.toml to its state on the
      # default branch first. A changelog that does not exist there is deleted
      # rather than restored: it is new in this branch, so its correct prior
      # state is "absent".
      #
      # Formerly the `actions/reset-changelogs` composite action. Keep this
      # step identical in prepare-release.yml and prepare-prerelease.yml;
      # ci.yml checks that, and tests prepare-release.yml's copy.
      - name: Reset changelogs
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          KNOPE_CONFIG: knope.toml
        run: |
          set -euo pipefail

          if [[ ! -f "${KNOPE_CONFIG}" ]]; then
            echo "No ${KNOPE_CONFIG}; nothing to reset."
            exit 0
          fi

          # knope.toml declares either one [package] or a [packages] table, each
          # optionally naming a changelog. tomllib ships with the runner's
          # Python, so this needs nothing installed.
          # A while-read loop rather than mapfile, which is bash 4 and so absent
          # from the bash macOS ships; this should run the same locally.
          changelogs=()
          while IFS= read -r line; do
            changelogs+=("${line}")
          done < <(python3 - "${KNOPE_CONFIG}" <<'PY'
          import sys, tomllib

          with open(sys.argv[1], "rb") as f:
              config = tomllib.load(f)

          packages = config.get("packages")
          if packages:
              entries = packages.values()
          else:
              entries = [config.get("package", {})]

          for entry in entries:
              changelog = entry.get("changelog")
              if changelog:
                  print(changelog)
          PY
          )

          if [[ ${#changelogs[@]} -eq 0 ]]; then
            echo "No changelog declared in ${KNOPE_CONFIG}; nothing to reset."
            exit 0
          fi

          # The default branch is not necessarily checked out, and a shallow
          # clone may not have it at all.
          git fetch --no-tags --depth=1 origin "${DEFAULT_BRANCH}"

          for changelog in "${changelogs[@]}"; do
            if git cat-file -e "FETCH_HEAD:${changelog}" 2>/dev/null; then
              echo "Restoring ${changelog} from origin/${DEFAULT_BRANCH}"
              git restore --source=FETCH_HEAD -- "${changelog}"
            elif [[ -e "${changelog}" ]]; then
              echo "${changelog} does not exist on ${DEFAULT_BRANCH}; removing it"
              rm -f "${changelog}"
            else
              echo "${changelog} exists on neither side; nothing to do"
            fi
          done

          git status --short

      - name: Dry-run release
        if: github.event_name == 'pull_request'
        env:
          KNOPE_WORKFLOW: ${{ inputs.knope-workflow }}
        run: knope "${KNOPE_WORKFLOW}" --verbose --dry-run

      # Through env, not interpolation: a shell script is not the place to
      # expand a value from the event payload.
      - name: Configure git identity
        if: github.event_name == 'push'
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          git config --global user.name "${ACTOR}"
          git config --global user.email "${ACTOR}@users.noreply.github.com"

      - name: Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
          KNOPE_WORKFLOW: ${{ inputs.knope-workflow }}
        run: knope "${KNOPE_WORKFLOW}" --verbose
