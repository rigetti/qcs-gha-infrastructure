name: release-please draft release

# Reusable workflow: after the release PR is merged, create the GitHub release
# as a DRAFT. Pair it with release-please-publish.yml, which attaches assets and
# publishes, so a release is never visible without its assets.
#
# Prototype, alongside (not replacing) the knope workflows. See the README
# section "release-please" and `agent-choices.md` for the design.
#
# Meant for `workflow_dispatch` on the default branch, after merging the PR that
# release-please-pr.yml opened. The caller needs:
#
#   permissions:
#     contents: write
#     pull-requests: write
#     issues: write
#
# A draft has no tag: GitHub creates the tag, at the release's
# `target_commitish`, when the draft is published. Build assets from the
# `sha` output, not from the tag.
#
# Safe to re-run, whatever state the last run stopped in:
#   - published release for the version: nothing to do (`state=published`);
#   - draft for the version: reuse it (`state=draft`);
#   - neither: let release-please create the draft from the merged release PR;
#   - still none, but the tag exists: create the draft from the tag, because
#     release-please only acts on a PR it has not yet marked as tagged;
#   - still none, and no tag: nothing is pending (`state=none`).
on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the release-please config in the repository.
        type: string
        required: false
        default: release-please-config.json
      manifest-file:
        description: Path to the release-please manifest in the repository.
        type: string
        required: false
        default: .release-please-manifest.json
      package:
        description: Package key in the manifest whose version is released.
        type: string
        required: false
        default: "."
      tag-prefix:
        description: >-
          Prefix of the release tag. The config must keep
          `include-component-in-tag` false, so the tag is exactly
          `<prefix><manifest version>`.
        type: string
        required: false
        default: v
      release-please-version:
        description: Version of the release-please npm package to run.
        type: string
        required: false
        default: "17.11.2"
    secrets:
      token:
        description: >-
          Token used to create the release. The job's GITHUB_TOKEN is the
          default.
        required: false
    outputs:
      state:
        description: "`draft`, `published`, or `none` (nothing pending)."
        value: ${{ jobs.draft.outputs.state }}
      tag:
        description: Tag the release carries or will carry.
        value: ${{ jobs.draft.outputs.tag }}
      version:
        description: Version being released, without the tag prefix.
        value: ${{ jobs.draft.outputs.version }}
      sha:
        description: Commit the release is cut from. Build from this.
        value: ${{ jobs.draft.outputs.sha }}
      release-id:
        description: Numeric id of the draft release.
        value: ${{ jobs.draft.outputs.release-id }}

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      state: ${{ steps.final.outputs.state }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.final.outputs.sha }}
      release-id: ${{ steps.final.outputs.release-id }}
    env:
      GH_TOKEN: ${{ secrets.token || github.token }}
    steps:
      - name: Validate context and inputs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONFIG_FILE: ${{ inputs.config-file }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
          PACKAGE: ${{ inputs.package }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          RP_VERSION: ${{ inputs.release-please-version }}
        run: |
          set -euo pipefail
          path_re='^[A-Za-z0-9._/-]+$'
          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Cannot tell the default branch from the event; dispatch this manually."
            exit 1
          fi
          # A release cut from another branch would tag unmerged work.
          if [[ "${REF_TYPE}" != "branch" || "${REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Refusing to run on '${REF_NAME}'; dispatch on '${DEFAULT_BRANCH}'."
            exit 1
          fi
          for p in "${CONFIG_FILE}" "${MANIFEST_FILE}"; do
            if [[ ! "${p}" =~ ${path_re} || "${p}" == *..* ]]; then
              echo "::error::Invalid path '${p}'."
              exit 1
            fi
          done
          if [[ ! "${PACKAGE}" =~ ${path_re} ]]; then
            echo "::error::Invalid package '${PACKAGE}'."
            exit 1
          fi
          if [[ ! "${TAG_PREFIX}" =~ ^[A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid tag-prefix '${TAG_PREFIX}'."
            exit 1
          fi
          if [[ ! "${RP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release-please-version must be X.Y.Z, got '${RP_VERSION}'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The manifest on the default branch is the source of truth: merging the
      # release PR is what moved it to the new version.
      - name: Read the version to release
        id: version
        env:
          MANIFEST_FILE: ${{ inputs.manifest-file }}
          PACKAGE: ${{ inputs.package }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          version="$(jq -r --arg k "${PACKAGE}" '.[$k] // empty' "${MANIFEST_FILE}")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::No valid version for '${PACKAGE}' in ${MANIFEST_FILE}: '${version}'."
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "tag=${TAG_PREFIX}${version}" >>"${GITHUB_OUTPUT}"

      # Published and draft releases both come back from the list endpoint;
      # `releases/tags/<tag>` hides drafts.
      - name: Look for an existing release
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          release="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -c --arg t "${TAG}" '[.[] | select(.tag_name == $t)] | first // empty')"
          if [[ -n "${release}" ]]; then
            state="$(jq -r 'if .draft then "draft" else "published" end' <<<"${release}")"
          else
            state="none"
          fi
          echo "state=${state}" >>"${GITHUB_OUTPUT}"
          echo "${TAG}: ${state}"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.existing.outputs.state == 'none'
        with:
          node-version: "22"

      # No `--prerelease`: with that flag release-please marks every 0.x
      # version as a prerelease. A suffixed version is marked at publish time.
      - name: Let release-please create the draft
        if: steps.existing.outputs.state == 'none'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONFIG_FILE: ${{ inputs.config-file }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
          RP_VERSION: ${{ inputs.release-please-version }}
        run: |
          set -euo pipefail
          npx --yes "release-please@${RP_VERSION}" github-release \
            --token "${GH_TOKEN}" \
            --repo-url "${GITHUB_REPOSITORY}" \
            --target-branch "${DEFAULT_BRANCH}" \
            --config-file "${CONFIG_FILE}" \
            --manifest-file "${MANIFEST_FILE}" \
            --draft

      - name: Resolve the final state
        id: final
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          find_release() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -c --arg t "${TAG}" '[.[] | select(.tag_name == $t)] | first // empty'
          }
          release="$(find_release)"

          # The tag can exist without a release: someone pushed it, or an
          # earlier run died between the two. Cover it with a draft.
          if [[ -z "${release}" ]] \
            && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} exists without a release; creating a draft."
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" -f name="${TAG}" -f target_commitish="${sha}" \
              -F draft=true -F generate_release_notes=true >/dev/null
            release="$(find_release)"
          fi

          if [[ -z "${release}" ]]; then
            echo "state=none" >>"${GITHUB_OUTPUT}"
            echo "::notice::Nothing to release: no merged release PR is pending for ${TAG}."
            exit 0
          fi

          state="$(jq -r 'if .draft then "draft" else "published" end' <<<"${release}")"
          id="$(jq -r .id <<<"${release}")"
          sha="$(jq -r .target_commitish <<<"${release}")"
          # Usually a SHA already; resolve a branch name to the commit.
          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq .sha)"
          fi
          {
            echo "state=${state}"
            echo "release-id=${id}"
            echo "sha=${sha}"
          } >>"${GITHUB_OUTPUT}"
          echo "${TAG}: ${state} (release ${id}, commit ${sha})"
