name: CI

# Smoke tests for this repository's own actions. Nothing here is exhaustive:
# the point is that a change which breaks an action fails here rather than in a
# consumer's pipeline.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # actionlint parses every workflow, checks expression syntax and context
      # availability, and runs shellcheck over each `run:` block.
      # taiki-e/install-action does not carry actionlint, so use upstream's own
      # installer, with the version pinned for the usual reasons.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          bash <(curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            "${ACTIONLINT_VERSION}"
          ./actionlint --version
      - run: ./actionlint -color
      - name: Shellcheck the scripts
        run: shellcheck scripts/*
      # A workflow here that references this repository by tag runs that
      # tag's code, not the code next to it, and every release would have to
      # rewrite the tag. Nested reusable workflows use `./.github/workflows/`,
      # which resolves to the caller's own commit; steps are inlined, because
      # a step-level local path resolves against the caller's repository.
      - name: No workflow references this repository by tag
        run: |
          set -euo pipefail
          dirs=(.github)
          if [[ -d actions ]]; then
            dirs+=(actions)
          fi
          if grep -rniE "uses:[[:space:]]*[\"']?rigetti/qcs-gha-infrastructure/" "${dirs[@]}"; then
            echo "::error::Use ./.github/workflows/<file>.yml for a nested reusable workflow, and inline steps rather than calling an action from this repository."
            exit 1
          fi
          echo "No self-references found."
      # The other half of the same trap: a step-level local action looks fine
      # in this repository's CI and breaks every caller in another repository.
      - name: No step uses a local action
        run: |
          set -euo pipefail
          if grep -rnE "uses:[[:space:]]*[\"']?\./" .github \
              | grep -vE "uses:[[:space:]]*[\"']?\./\.github/workflows/"; then
            echo "::error::A local action resolves against the caller's checkout; inline its steps instead."
            exit 1
          fi
          echo "No local actions found."
      - name: Inlined step copies agree
        run: scripts/check-inlined-steps

      - name: Rulesets are valid JSON with the keys the API needs
        run: |
          set -euo pipefail
          for f in rulesets/*.json; do
            echo "checking ${f}"
            jq -e '.name and .target and .enforcement and .rules' "${f}" >/dev/null
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/test-apply-ruleset
      - run: scripts/test-lint-release-pins

  # Runs the prerelease workflow's bump step, verbatim, over this repository's
  # real files with release-please's own updaters.
  release-please-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: scripts/test-release-please-bump

  # The setup-rust steps are what every Rust workflow here depends on, so check
  # that they produce a working toolchain with the components asked for.
  # scripts/check-inlined-steps makes sure this copy is the one they all carry.
  setup-rust:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    env:
      SETUP_RUST_TOOLCHAIN: stable
      SETUP_RUST_COMPONENTS: clippy rustfmt
      SETUP_RUST_TARGETS: x86_64-unknown-linux-musl
      # Nothing to cache in this repository, and a cache entry per platform
      # for an empty project is waste.
      SETUP_RUST_CACHE: "false"
      SETUP_RUST_CACHE_KEY: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-rust, inlined: keep every copy identical (scripts/check-inlined-steps).
      - name: Install Rust toolchain (setup-rust)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.cargo/bin:${PATH}"
          fi
          rustup toolchain install "${SETUP_RUST_TOOLCHAIN}" --profile minimal --no-self-update
          rustup default "${SETUP_RUST_TOOLCHAIN}"
          # Both lists are space-separated, so word splitting is intended.
          # shellcheck disable=SC2086
          for component in ${SETUP_RUST_COMPONENTS}; do
            rustup component add --toolchain "${SETUP_RUST_TOOLCHAIN}" "${component}"
          done
          # shellcheck disable=SC2086
          for target in ${SETUP_RUST_TARGETS}; do
            rustup target add --toolchain "${SETUP_RUST_TOOLCHAIN}" "${target}"
          done
          rustc --version
          cargo --version
      - name: Configure cargo for CI (setup-rust)
        shell: bash
        run: |
          {
            echo "CARGO_TERM_COLOR=always"
            echo "CARGO_INCREMENTAL=0"
            echo "RUSTUP_TOOLCHAIN=${SETUP_RUST_TOOLCHAIN}"
          } >> "${GITHUB_ENV}"
      - name: Cache cargo registry (setup-rust)
        if: env.SETUP_RUST_CACHE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.SETUP_RUST_TOOLCHAIN }}-${{ env.SETUP_RUST_CACHE_KEY }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.SETUP_RUST_TOOLCHAIN }}-${{ env.SETUP_RUST_CACHE_KEY }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.SETUP_RUST_TOOLCHAIN }}-
      - name: The toolchain and its components are usable
        shell: bash
        run: |
          set -euo pipefail
          cargo --version
          rustc --version
          cargo clippy --version
          cargo fmt --version
          rustup target list --installed | grep x86_64-unknown-linux-musl
          # setup-rust sets these for every consumer; a change that drops them
          # would go unnoticed otherwise.
          [[ "${CARGO_TERM_COLOR}" == "always" ]]
          [[ "${CARGO_INCREMENTAL}" == "0" ]]
          [[ "${RUSTUP_TOOLCHAIN}" == "${SETUP_RUST_TOOLCHAIN}" ]]

  reset-changelogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Test the script the prepare workflows actually run, rather than a
      # copy of it. scripts/check-inlined-steps keeps their two copies equal.
      - name: Extract the "Reset changelogs" script
        run: |
          set -euo pipefail
          yq '.jobs[].steps[] | select(.name == "Reset changelogs") | .run' \
            .github/workflows/prepare-release.yml > "${RUNNER_TEMP}/reset-changelogs"
          [[ -s "${RUNNER_TEMP}/reset-changelogs" ]]

      # A changelog tracked on the default branch must come back to its
      # committed state, however it was mangled. The fixture config names
      # README.md, which is tracked here by definition.
      - name: A tracked changelog is restored
        run: |
          set -euo pipefail
          echo "accumulated prerelease entry" >> README.md

      - name: Reset changelogs
        env:
          DEFAULT_BRANCH: main
          KNOPE_CONFIG: tests/fixtures/knope.toml
        run: bash "${RUNNER_TEMP}/reset-changelogs"

      - name: Check it was restored
        run: |
          set -euo pipefail
          if grep -q "accumulated prerelease entry" README.md; then
            echo "::error::reset-changelogs left the added entry in place"
            exit 1
          fi
          # Deliberately not `git diff --quiet`: the file is restored from the
          # default branch, so a pull request that edits it legitimately differs
          # from what was restored. The invariant under test is that the
          # appended entry is gone.
          echo "README.md was restored from the default branch"
          [[ -s README.md ]]

      # A changelog that does not exist on the default branch is new in this
      # branch, so its correct prior state is absent.
      - name: An untracked changelog is removed
        run: |
          set -euo pipefail
          printf '[package]\nchangelog = "NEW-CHANGELOG.md"\n' > untracked-knope.toml
          echo "brand new" > NEW-CHANGELOG.md

      - name: Reset changelogs
        env:
          DEFAULT_BRANCH: main
          KNOPE_CONFIG: untracked-knope.toml
        run: bash "${RUNNER_TEMP}/reset-changelogs"

      - name: Check it was removed
        run: |
          set -euo pipefail
          if [[ -e NEW-CHANGELOG.md ]]; then
            echo "::error::reset-changelogs left an untracked changelog behind"
            exit 1
          fi

      # A repository with no knope.toml must be a no-op, not an error.
      - name: A missing config is not an error
        run: rm -f untracked-knope.toml
      - name: Reset changelogs
        env:
          DEFAULT_BRANCH: main
          KNOPE_CONFIG: does-not-exist.toml
        run: bash "${RUNNER_TEMP}/reset-changelogs"

  ci-gate:
    name: CI gate
    if: always()
    # Only jobs in this workflow: `needs` cannot reach across workflows. The
    # release dry-run in release.yml reports its own check.
    needs: [lint, scripts, release-please-bump, setup-rust, reset-changelogs]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}" | jq .
          if ! echo "${RESULTS}" | jq -e 'all(.[].result; . == "success")' >/dev/null; then
            echo "::error::A required job did not succeed."
            exit 1
          fi
