name: release-please publish

# Reusable workflow: attach build artifacts to a draft release, then publish it.
# The second half of release-please-draft.yml (or of the prerelease flow).
#
# Prototype, alongside (not replacing) the knope workflows. See the README
# section "release-please" and `agent-choices.md` for the design.
#
# Artifacts are collected from the current run by name pattern (default
# `release-*`), merged into one directory, and uploaded under their file names.
# Two artifacts holding a file of the same name overwrite each other.
#
# Only the release is made public here; a draft is invisible, so a release
# never exists without its assets. The caller needs:
#
#   permissions:
#     contents: write
#
# Safe to re-run:
#   - already published: nothing to do;
#   - assets already uploaded: each is replaced, not duplicated;
#   - no draft and no release for the tag: fails, as there is nothing to
#     publish.
#
# GitHub's own default decides whether the published release becomes "Latest":
# no `make_latest` is sent. A release whose version has a suffix (such as
# `-rc.1`) is published as a prerelease.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the draft release, e.g. the `tag` output of the draft workflow.
        type: string
        required: true
      artifact-pattern:
        description: Pattern of artifact names to attach.
        type: string
        required: false
        default: "release-*"
      artifact-path:
        description: Directory the artifacts are downloaded into.
        type: string
        required: false
        default: release
      require-assets:
        description: >-
          Fail if no files were found to attach. Set to false for a project
          that ships no binaries.
        type: boolean
        required: false
        default: true
    secrets:
      token:
        description: Token used to upload and publish. The job's GITHUB_TOKEN is the default.
        required: false
    outputs:
      release-url:
        description: URL of the published release.
        value: ${{ jobs.publish.outputs.release-url }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.publish.outputs.release-url }}
    env:
      GH_TOKEN: ${{ secrets.token || github.token }}
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          ARTIFACT_PATTERN: ${{ inputs.artifact-pattern }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid tag '${TAG}'."
            exit 1
          fi
          if [[ ! "${ARTIFACT_PATH}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::artifact-path must be a plain directory name, got '${ARTIFACT_PATH}'."
            exit 1
          fi
          if [[ ! "${ARTIFACT_PATTERN}" =~ ^[A-Za-z0-9._*?-]+$ ]]; then
            echo "::error::Invalid artifact-pattern '${ARTIFACT_PATTERN}'."
            exit 1
          fi

      # `releases/tags/<tag>` hides drafts, hence the list endpoint.
      - name: Find the release
        id: find
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -c --arg t "${TAG}" '[.[] | select(.tag_name == $t)] | first // empty')"
          if [[ -z "${release}" ]]; then
            echo "::error::No release or draft for ${TAG}. Run the draft workflow first."
            exit 1
          fi
          {
            echo "state=$(jq -r 'if .draft then "draft" else "published" end' <<<"${release}")"
            echo "id=$(jq -r .id <<<"${release}")"
            echo "prerelease=$(jq -r .prerelease <<<"${release}")"
            echo "url=$(jq -r .html_url <<<"${release}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Already published
        if: steps.find.outputs.state == 'published'
        env:
          TAG: ${{ inputs.tag }}
        run: echo "::notice::${TAG} is already published; nothing to do."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.find.outputs.state == 'draft'
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: ${{ inputs.artifact-path }}
          merge-multiple: true

      - name: Attach assets
        if: steps.find.outputs.state == 'draft'
        env:
          RELEASE_ID: ${{ steps.find.outputs.id }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          REQUIRE_ASSETS: ${{ inputs.require-assets }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do
            files+=("${f}")
          done < <(find "${ARTIFACT_PATH}" -type f -print0 | sort -z)
          if [[ "${#files[@]}" -eq 0 ]]; then
            if [[ "${REQUIRE_ASSETS}" == "true" ]]; then
              echo "::error::No files under ${ARTIFACT_PATH}; refusing to publish a release without assets."
              exit 1
            fi
            echo "No assets to attach."
            exit 0
          fi

          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -c '.[] | {id, name}')"

          for f in "${files[@]}"; do
            name="$(basename "${f}")"
            # Replace, not duplicate, so a re-run converges.
            while IFS= read -r old; do
              [[ -n "${old}" ]] || continue
              echo "Deleting stale asset ${name} (${old})"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${old}"
            done < <(jq -r --arg n "${name}" 'select(.name == $n) | .id' <<<"${existing}")
            echo "Uploading ${name}"
            # curl, not gh: the upload endpoint lives on uploads.github.com.
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(jq -rn --arg n "${name}" '$n | @uri')" \
              >/dev/null
          done

          # Check before publishing: the release must hold every file.
          have="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -r '.[] | .name' | sort -u)"
          for f in "${files[@]}"; do
            if ! grep -Fxq -- "$(basename "${f}")" <<<"${have}"; then
              echo "::error::$(basename "${f}") is missing from the draft after upload."
              exit 1
            fi
          done

      - name: Publish
        id: publish
        env:
          RELEASE_ID: ${{ steps.find.outputs.id }}
          STATE: ${{ steps.find.outputs.state }}
          WAS_PRERELEASE: ${{ steps.find.outputs.prerelease }}
          TAG: ${{ inputs.tag }}
          URL: ${{ steps.find.outputs.url }}
        run: |
          set -euo pipefail
          if [[ "${STATE}" == "draft" ]]; then
            prerelease="${WAS_PRERELEASE}"
            if [[ "${TAG}" == *-* ]]; then
              prerelease="true"
            fi
            # Publishing a draft is what creates its tag.
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false -F prerelease="${prerelease}" >/dev/null
            echo "Published ${TAG}."
          fi
          echo "release-url=${URL}" >>"${GITHUB_OUTPUT}"
