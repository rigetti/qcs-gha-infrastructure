name: Self test

# Exercises the actions in this repository against this repository, so a broken
# action is caught here rather than in a consumer's CI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  todo-curator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/todo-curator
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gitlab-token: ${{ secrets.GL_TOKEN }}
          command: check-all
          # This repository's docs discuss TODO comments in prose, which the
          # checker reads as malformed references. Exercises the input, too.
          exclude-file-regex: 'README\.md|actions/todo-curator/action\.yml'
