name: Knope dry run

# Reusable workflow: verify that a release can be prepared from the changeset(s)
# on this branch. Intended to run on pull requests.
on:
  workflow_call:
    inputs:
      knope-version:
        type: string
        required: false
        default: "0.23.0"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: rigetti/qcs-gha-infrastructure/actions/setup-knope@main
        with:
          version: ${{ inputs.knope-version }}
      - name: Prepare release (dry run)
        run: knope release --dry-run
