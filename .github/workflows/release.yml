name: Release

# Dry-runs a release on every pull request, and releases when one merges.
# Dogfooding: this calls the same reusable workflow the other QCS repositories
# do, by local path so it is always this branch's copy under test.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  release:
    uses: ./.github/workflows/prepare-release.yml
    secrets:
      # Publishing needs no downstream trigger here, so the job's own token
      # would do; a PAT keeps the released-by identity consistent with the
      # other repositories.
      token: ${{ secrets.RELEASE_TOKEN }}
