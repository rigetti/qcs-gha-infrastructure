name: Rust CLI build

# Reusable workflow: build a release binary per platform and upload each one as
# an artifact named `release-<target>`, containing `<bin>-<target>`.
#
# Callers attach the artifacts to a release themselves; see
# todo-curator's cli-release.yml.
on:
  workflow_call:
    inputs:
      bin:
        description: Name of the binary to build, as `cargo build -p` expects it.
        type: string
        required: true
      matrix:
        description: >-
          JSON array of `{"runs-on": …, "target": …}` objects. Empty means the
          default: musl Linux on both architectures, arm64 macOS, and x86_64
          Windows. Empty rather than a literal default so that a workflow
          forwarding this input can pass through "no opinion".
        type: string
        required: false
        default: ""
      toolchain:
        type: string
        required: false
        default: stable
      ref:
        description: >-
          Git ref to check out. Defaults to the event's own ref, which for
          workflow_dispatch is the commit the run started at — pass a branch
          name when an earlier job in the same run has pushed to it.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.matrix != '' && inputs.matrix || '[
            {"runs-on": "ubuntu-latest",    "target": "x86_64-unknown-linux-musl"},
            {"runs-on": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-musl"},
            {"runs-on": "macos-14",         "target": "aarch64-apple-darwin"},
            {"runs-on": "windows-latest",   "target": "x86_64-pc-windows-msvc"}
          ]') }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # Keep the path short: deep dependency trees overrun Windows' path limit
      # when building inside the workspace. The `runner` context is not
      # available in a job-level `env`, hence the step.
      - name: Use a short target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/t" >> "${GITHUB_ENV}"
      - uses: rigetti/qcs-gha-infrastructure/actions/setup-rust@v0.4.0
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ matrix.target }}
          # A release build happens once per release; a cache would mostly be a
          # cold miss, and CARGO_TARGET_DIR is outside the cached path anyway.
          cache: "false"

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        run: cargo build -p '${{ inputs.bin }}' --target '${{ matrix.target }}' --release

      # Values reach the script through env rather than ${{ }} interpolation:
      # shellcheck cannot reason about an interpolated literal — it reported the
      # windows comparison as one that could never match — and interpolating
      # into a shell script is how injection bugs start.
      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ inputs.bin }}
        run: |
          set -euo pipefail
          mkdir -p release
          ext=""
          if [[ "${TARGET}" == *windows* ]]; then
            ext=".exe"
          fi
          cp "${CARGO_TARGET_DIR}/${TARGET}/release/${BIN}${ext}" \
             "release/${BIN}-${TARGET}${ext}"
          chmod +x release/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error
