name: Setup Knope
description: Install the knope release-automation CLI from its GitHub releases.

inputs:
  version:
    description: Knope version to install, without a leading "v".
    required: false
    default: "0.23.0"

runs:
  using: composite
  steps:
    - name: Install knope
      shell: bash
      env:
        KNOPE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  target=x86_64-unknown-linux-musl ;;
          Linux-aarch64) target=aarch64-unknown-linux-musl ;;
          Darwin-arm64)  target=aarch64-apple-darwin ;;
          Darwin-x86_64) target=x86_64-apple-darwin ;;
          *) echo "Unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac
        url="https://github.com/knope-dev/knope/releases/download/knope/v${KNOPE_VERSION}/knope-${target}.tgz"
        echo "Downloading ${url}"
        mkdir -p "${HOME}/.local/bin"
        curl -fsSL "${url}" | tar -xz -C "${RUNNER_TEMP}"
        find "${RUNNER_TEMP}" -name knope -type f -exec install -m 0755 {} "${HOME}/.local/bin/knope" \;
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        "${HOME}/.local/bin/knope" --version
