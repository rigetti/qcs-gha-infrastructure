name: Setup Rust
description: >-
  Install a Rust toolchain via rustup and set up compilation caching, either
  through sccache (default) or by caching the target directory.

inputs:
  toolchain:
    description: Rust toolchain to install (e.g. stable, 1.85, nightly).
    required: false
    default: stable
  components:
    description: Space-separated rustup components (e.g. "clippy rustfmt").
    required: false
    default: ""
  targets:
    description: Space-separated rustup target triples to add.
    required: false
    default: ""
  cache:
    description: >-
      Whether to cache anything at all. Set to "false" for untrusted code, so
      that its build products never reach a cache a later run can read.
    required: false
    default: "true"
  cache-key:
    description: Extra discriminator appended to the cache key, so unrelated jobs do not share a cache.
    required: false
    default: default
  sccache:
    description: >-
      Use sccache as the compiler wrapper, storing individual compilation units
      in the GitHub Actions cache service. When enabled, the target directory is
      not cached, since sccache is meant to replace it.

      Defaults to "false": measured on todo-curator, sccache produced a 0% hit
      rate with ~150 cache write errors per job, and jobs ran 1.5-3x SLOWER than
      with a plain target-directory cache. It also cannot cache `cargo
      check`/`clippy` at all, which only emit metadata. Try it on
      build-dominated jobs and read the stats in the post-run step before
      trusting it.
    required: false
    default: "false"
  sccache-version:
    description: Version of mozilla-actions/sccache-action's sccache binary; empty means the action's default.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.cargo/bin:${PATH}"
        fi
        rustup toolchain install '${{ inputs.toolchain }}' --profile minimal --no-self-update
        rustup default '${{ inputs.toolchain }}'
        for component in ${{ inputs.components }}; do
          rustup component add --toolchain '${{ inputs.toolchain }}' "${component}"
        done
        for target in ${{ inputs.targets }}; do
          rustup target add --toolchain '${{ inputs.toolchain }}' "${target}"
        done
        rustc --version
        cargo --version

    - name: Configure cargo for CI
      shell: bash
      run: |
        echo "CARGO_TERM_COLOR=always" >> "${GITHUB_ENV}"
        echo "CARGO_INCREMENTAL=0" >> "${GITHUB_ENV}"
        echo "RUSTUP_TOOLCHAIN=${{ inputs.toolchain }}" >> "${GITHUB_ENV}"

    # sccache's `gha` backend writes to the GitHub Actions cache service, the
    # same store actions/cache uses, so no external cache infrastructure is
    # needed. CARGO_INCREMENTAL=0 above is a prerequisite: incremental
    # artifacts are not cacheable, and sccache skips those units entirely.
    - name: Install sccache
      if: inputs.cache == 'true' && inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: ${{ inputs.sccache-version }}

    - name: Enable sccache
      if: inputs.cache == 'true' && inputs.sccache == 'true'
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "${GITHUB_ENV}"
        echo "RUSTC_WRAPPER=sccache" >> "${GITHUB_ENV}"

    - name: Cache cargo registry
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # The target directory is only worth caching without sccache; with it,
        # compilation units come back from the sccache entries instead.
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ${{ inputs.sccache != 'true' && 'target' || '' }}
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-key }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-key }}-
          cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-
